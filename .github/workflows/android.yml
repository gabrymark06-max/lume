name: Pacchetto Android e TV
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Firma privata
        env:
          KEYSTORE: ${{ secrets.LUME_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/lume.jks"
      - name: Compila e controlla
        env:
          LUME_STORE_FILE: ${{ runner.temp }}/lume.jks
          LUME_STORE_PASSWORD: ${{ secrets.LUME_STORE_PASSWORD }}
        run: gradle -p android assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lume-android-tv
          path: android/app/build/outputs/apk/release/app-release.apk
